<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>딱 반 — 눈대중으로 반으로 자르기</title>
<style>
  :root{
    --bg:#f5efe6; --panel:#fffdf8; --ink:#3d3128; --sub:#8a7a68;
    --accent:#c96f2f; --accent-soft:#f3ddc7; --line:#e3d7c6;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden;}
  body{font-family:-apple-system,'Pretendard','Noto Sans KR',sans-serif;background:var(--bg);color:var(--ink);}
  #stage{position:fixed;inset:0;}
  canvas{display:block;touch-action:none;}
  #hud{position:fixed;top:0;left:0;right:0;padding:14px 16px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:5;}
  #title{font-size:20px;font-weight:800;letter-spacing:-0.5px;}
  #title small{display:block;font-size:11px;font-weight:500;color:var(--sub);margin-top:2px;}
  #stats{text-align:right;font-size:12px;color:var(--sub);line-height:1.7;}
  #stats b{color:var(--ink);font-size:14px;}
  #tries span{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--line);margin-left:4px;}
  #tries span.on{background:var(--accent);}
  #panel{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);width:min(480px,calc(100% - 24px));background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;z-index:6;box-shadow:0 6px 24px rgba(61,49,40,.08);}
  .modes{display:flex;gap:8px;margin-bottom:10px;}
  .modes button{flex:1;padding:9px 0;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:600;color:var(--sub);cursor:pointer;}
  .modes button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}
  .sliders{display:none;gap:10px;margin-bottom:10px;}
  .sliders.show{display:flex;}
  .sliders label{flex:1;font-size:11px;color:var(--sub);display:flex;flex-direction:column;gap:4px;}
  .sliders input{width:100%;accent-color:var(--accent);}
  .actions{display:flex;gap:8px;}
  .actions button{flex:1;padding:12px 0;border-radius:12px;border:none;font-size:14px;font-weight:700;cursor:pointer;}
  #cutBtn{background:var(--accent);color:#fff;}
  #cutBtn:disabled{background:var(--line);color:var(--sub);cursor:default;}
  #clearBtn{background:#fff;border:1px solid var(--line);color:var(--sub);flex:0 0 96px;}
  #hint{text-align:center;font-size:12px;color:var(--sub);margin-bottom:10px;}
  #result{display:none;text-align:center;}
  #result.show{display:block;}
  #ratio{font-size:30px;font-weight:800;letter-spacing:1px;margin:4px 0;}
  #score{font-size:14px;color:var(--sub);margin-bottom:4px;}
  #score b{color:var(--accent);font-size:20px;}
  #grade{font-size:13px;color:var(--sub);margin-bottom:10px;}
  #againBtn{background:var(--accent);color:#fff;}
  #toast{position:fixed;top:76px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:12px;padding:8px 14px;border-radius:999px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9;}
  #loadMsg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:20;font-size:14px;color:var(--sub);}
  #final{display:none;position:fixed;inset:0;background:rgba(61,49,40,.45);z-index:15;align-items:center;justify-content:center;}
  #final.show{display:flex;}
  #final .card{background:var(--panel);border-radius:18px;padding:28px 32px;text-align:center;width:min(320px,86%);}
  #final h2{font-size:18px;margin-bottom:6px;}
  #finalBest{font-size:38px;font-weight:800;color:var(--accent);margin:8px 0;}
  #finalHistory{font-size:13px;color:var(--sub);margin-bottom:18px;line-height:1.8;}
  #restartBtn{width:100%;padding:12px 0;border:none;border-radius:12px;background:var(--accent);color:#fff;font-size:14px;font-weight:700;cursor:pointer;}
  .credit{position:fixed;bottom:4px;right:8px;font-size:10px;color:var(--sub);opacity:.7;z-index:5;}
  #soundBtn{position:fixed;bottom:12px;left:12px;z-index:7;background:var(--panel);border:1px solid var(--line);border-radius:10px;font-size:15px;padding:5px 9px;cursor:pointer;pointer-events:auto;}
  #todayLine{font-size:11px;color:var(--sub);margin-top:3px;}
  #todayLine b{color:var(--accent);}
  #practiceBtn{display:block;margin:8px auto 0;background:none;border:none;font-size:11px;color:var(--sub);text-decoration:underline;cursor:pointer;}
  #ratioBar{position:relative;height:8px;background:var(--line);border-radius:99px;margin:6px auto 8px;width:80%;overflow:visible;}
  #ratioBarA{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:99px 0 0 99px;transition:width .5s;}
  #ratioMark{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);transform:translateX(-50%);}
  #score.pop b{display:inline-block;animation:pop .45s ease;}
  @keyframes pop{0%{transform:scale(.4);opacity:0;}70%{transform:scale(1.15);}100%{transform:scale(1);opacity:1;}}

  #pickAgainBtn{width:100%;margin-top:8px;padding:12px 0;border-radius:12px;background:#fff;border:1px solid var(--line);color:var(--sub);font-size:14px;font-weight:700;cursor:pointer;}
  #picker{display:none;position:fixed;inset:0;background:rgba(61,49,40,.45);z-index:16;align-items:center;justify-content:center;}
  #picker.show{display:flex;}
  #picker .card{background:var(--panel);border-radius:18px;padding:18px 16px;width:min(430px,92%);max-height:82vh;display:flex;flex-direction:column;}
  #picker h2{font-size:17px;margin-bottom:10px;text-align:center;}
  #pickChips{display:flex;gap:6px;margin-bottom:10px;}
  #pickChips button{flex:1;padding:7px 0;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:12px;font-weight:600;color:var(--sub);cursor:pointer;white-space:nowrap;}
  #pickChips button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}
  #pickGrid{overflow-y:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .pickItem{border:1px solid var(--line);border-radius:12px;background:#fff;padding:10px 4px;cursor:pointer;display:flex;flex-direction:column;gap:2px;align-items:center;}
  .pickItem b{font-size:13px;}
  .pickItem span{font-size:10px;color:var(--sub);}
  #pickClose{display:block;margin:10px auto 0;background:none;border:none;font-size:12px;color:var(--sub);text-decoration:underline;cursor:pointer;}
</style>
</head>
<body>
<div id="stage"></div>
<div id="hud">
  <div id="title">딱 반<small>눈대중으로 반으로 자르기</small>
    <div id="todayLine"><b id="todayObj"></b></div>
  </div>
  <div id="stats">
    <div id="triesWrap">남은 기회 <span id="tries"><span class="on"></span><span class="on"></span><span class="on"></span></span></div>
    <div>오늘 최고(모든 물건) <b id="todayBest">—</b></div>
    <div>전체 최고 <b id="best">—</b></div>
  </div>
</div>
<div id="panel">
  <div id="play">
    <div id="hint">선을 그어 반으로 잘라보세요</div>
    <div class="modes">
      <button id="modeDraw" class="on">✂️ 선 긋기</button>
      <button id="modeRotate">🔄 돌려보기</button>
    </div>
    <div class="sliders" id="sliders">
      <label>각도 <span id="angleVal">0°</span><input type="range" id="angle" min="-75" max="75" value="0" step="0.5"></label>
      <label>위치 <span id="offVal">0</span><input type="range" id="offset" min="-100" max="100" value="0" step="1"></label>
    </div>
    <div class="actions">
      <button id="clearBtn">선 지우기</button>
      <button id="cutBtn" disabled>자르기 확정</button>
    </div>
    <button id="practiceBtn">📦 다른 물건 고르기</button>
  </div>
  <div id="result">
    <div id="score">이번 점수 <b id="scoreVal">0</b>점</div>
    <div id="ratio">50 : 50</div>
    <div id="ratioBar"><div id="ratioBarA"></div><div id="ratioMark"></div></div>
    <div id="grade"></div>
    <div class="actions"><button id="againBtn">다시 자르기</button></div>
  </div>
</div>
<div id="toast"></div>
<div id="loadMsg">준비 중…</div>
<div id="final">
  <div class="card">
    <h2 id="finalTitle">결과</h2>
    <div id="finalBest">0</div>
    <div id="finalHistory"></div>
    <button id="restartBtn">같은 물건 다시</button>
    <button id="pickAgainBtn">다른 물건 고르기</button>
  </div>
</div>
<div id="picker">
  <div class="card">
    <h2>자를 물건 고르기</h2>
    <div id="pickChips">
      <button data-d="" class="on">전체</button>
      <button data-d="쉬움">쉬움</button>
      <button data-d="보통">보통</button>
      <button data-d="어려움">어려움</button>
      <button id="randPick">🎲 랜덤</button>
    </div>
    <div id="pickGrid"></div>
    <button id="pickClose">닫기</button>
  </div>
</div>
<button id="soundBtn">🔊</button>
<div class="credit">모델: Kenney (CC0) — Food / Nature / Space / Pirate / Fantasy Town Kit</div>
<script type="module" src="./app.js?v=6"></script>
</body>
</html>
